upstream django_app {
    server aplikacija:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost _;

    client_max_body_size 50M;

    # Statične datoteke
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    # Naložene medijske datoteke (gradiva in oddane naloge)
    location /media/ {
        alias /app/media/;
        expires 7d;
        access_log off;
    }

    # Posredovanje zahtev na Django aplikacijo (Gunicorn)
    location / {
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}

